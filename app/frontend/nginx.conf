server {
    listen 80;
    server_name _;

    # Allow the 25 MB image uploads through to the backend.
    client_max_body_size 26m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve static assets, fall back to index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy to the Node backend (no CORS needed in the browser).
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CPU inference can take several seconds — give it room.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
